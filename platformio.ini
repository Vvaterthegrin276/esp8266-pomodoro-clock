[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; NodeMCU 1.0 (ESP-12E module)
; Mo Serial Monitor (hinh dang cong) de xem log boot

; Thu vien tu dong tai ve tu PlatformIO Registry
lib_deps =
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays
  adafruit/RTClib
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor

; Giai ma exception khi firmware crash (rat huu ich khi debug)
monitor_filters = esp8266_exception_decoder
